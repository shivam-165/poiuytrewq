services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zephyrpulse-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - LLM_MODEL=${LLM_MODEL:-gemini-3.5-flash-lite}
      - MOCK_LLM=${MOCK_LLM:-false}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./backend/data:/app/data
      - ./backend/zephyrpulse.db:/app/zephyrpulse.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zephyrpulse-frontend
    ports:
      - "3000:80"
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped
